; Supervisor config untuk NexaSpace queue worker
; Copy file ini ke /etc/supervisor/conf.d/nexaspace.conf di server
; Ganti /home/u123456789/domains/nexaspace.site/public_html dengan path absolut project

[program:nexaspace-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /home/u123456789/domains/nexaspace.site/public_html/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=u123456789
numprocs=1
redirect_stderr=true
stdout_logfile=/home/u123456789/domains/nexaspace.site/public_html/storage/logs/worker.log
stopwaitsecs=3600

; Setelah edit file ini, jalankan:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start nexaspace-queue:*
;
; Untuk cek status:
;   sudo supervisorctl status nexaspace-queue:*
